    nl_bar_p_feas_tol = 1.0e-8
    optimality_target = -1
    optimality_tol = 1.0e-8
    output_flag = 1

        [run.gurobi.raw_options]

    [run.highs]
    dual_feasibility_tolerance = 1.0e-8
    ipm_iteration_limit = 5000
    ipm_optimality_tolerance = 1.0e-8
    output_flag = true
    primal_feasibility_tolerance = 1.0e-8
    simplex_iteration_limit = 5000
    solver = "choose"

        [run.highs.raw_options]

    [run.ipopt]
    compl_inf_tol = 1.0e-8
    constr_viol_tol = 1.0e-8
    dual_inf_tol = 1.0e-8
    hessian_approximation = "limited-memory"
    limited_memory_max_history = 50
    max_iter = 1000
    pardiso_lib_path = "C:\\Libraries\\Pardiso\\lib\\libpardiso.dll"
    pardiso_license_message = false
    print_level = 5
    tol = 1.0e-8

    [run.madnlp]
    hessian_approximation = "exact"
    max_iter = 3000
    print_level = 3
    tol = 1.0e-8

        [run.madnlp.raw_options]

