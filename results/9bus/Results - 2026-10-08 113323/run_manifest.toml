trans_stab = true

    [run.gurobi]
    bar_iter_limit = 5000
    feasibility_tol = 1.0e-8
    mip_gap = 1.0e-8
    nl_bar_c_feas_tol = 1.0e-8
    nl_bar_d_feas_tol = 1.0e-8
